<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonic Galactic</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif}
#wrap{display:flex;align-items:center;justify-content:center;height:100%}
canvas{max-width:100%;max-height:100%;image-rendering:pixelated;outline:none;display:none}
#ui{text-align:center}
#bar{width:320px;height:10px;background:#333;border-radius:5px;margin:12px auto;overflow:hidden}
#fill{height:100%;width:0;background:#2a7bff}
button{font-size:18px;padding:10px 24px;cursor:pointer}
</style></head><body>
<div id="wrap">
  <div id="ui">
    <h2>Sonic Galactic</h2>
    <button id="play">Jogar</button>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Clique em Jogar (baixa ~255 MB na 1ª vez; depois fica em cache)</div>
  </div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
</div>
<script>
const PARTS = 11; // quantidade de partes em data/Data.hatch.partN
const $ = id => document.getElementById(id);
const setMsg = t => $('msg').textContent = t;

async function loadData() {
  // cache no navegador (IndexedDB) para não baixar de novo
  const db = await new Promise((res, rej) => {
    const r = indexedDB.open('sg-cache', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const get = () => new Promise(res => { const q = db.transaction('f').objectStore('f').get('Data.hatch'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
  const put = b => new Promise(res => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').put(b, 'Data.hatch'); t.oncomplete = res; t.onerror = res; });
  let blob = await get();
  if (blob) return new Uint8Array(await blob.arrayBuffer());
  const chunks = []; let got = 0;
  for (let i = 0; i < PARTS; i++) {
    setMsg(`Baixando parte ${i + 1}/${PARTS}...`);
    const r = await fetch(`data/Data.hatch.part${i}`);
    if (!r.ok) throw new Error('Falha ao baixar parte ' + i);
    const buf = new Uint8Array(await r.arrayBuffer());
    chunks.push(buf); got += buf.length;
    $('fill').style.width = ((i + 1) / PARTS * 100) + '%';
  }
  const all = new Uint8Array(got); let o = 0;
  for (const c of chunks) { all.set(c, o); o += c.length; }
  put(new Blob([all]));
  return all;
}

$('play').onclick = async () => {
  $('play').disabled = true;
  try {
    const data = await loadData();
    setMsg('Iniciando engine...');
    const s = document.createElement('script');
    s.src = 'HatchGameEngine.js';
    s.onerror = () => setMsg('Não achei o arquivo da engine compilada (veja o log do build).');
    s.onload = async () => {
      const find = Object.keys(window).find(k => /^createModule|^Module$/.test(k));
      const Module = await (typeof window.createModule === 'function'
        ? window.createModule({canvas: $('canvas')}) : window.Module);
      Module.FS.writeFile('/Data.hatch', data);
      Module.FS.chdir('/');
      $('ui').style.display = 'none';
      $('canvas').style.display = 'block'; $('canvas').focus();
      Module.callMain([]);
    };
    document.body.appendChild(s);
  } catch (e) { setMsg('Erro: ' + e.message); $('play').disabled = false; }
};
</script></body></html>
